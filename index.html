<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Profile Viewer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main">
        <div class="firstDiv">
            <h1><i class="fab fa-github"></i> GitHub Profile Viewer</h1>
            <p class="subtitle">Enter a GitHub username to view profile details</p>
            <div class="search-container">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="userID" placeholder="Enter GitHub username...">
                    <button id="btn">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
                <div class="examples">
                    <p>Try: <span class="example-user" data-user="octocat">octocat</span>, 
                    <span class="example-user" data-user="torvalds">torvalds</span>, 
                    <span class="example-user" data-user="mojombo">mojombo</span></p>
                </div>
            </div>
        </div>
        
        <div class="secondDiv" id="userProfile">
            <div class="initial-state">
                <i class="fas fa-search fa-4x"></i>
                <h2>Search for a GitHub user</h2>
                <p>Enter a username above to view their profile information</p>
            </div>
        </div>
        
        <footer>
            <p>GitHub Profile Viewer &copy; 2023 | Built with GitHub API</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
